---
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs_sync:
    name: Docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check docs/help.html matches the in-app manual
        run: ./tools/sync-docs.sh --check
      - name: Check UI assets are cache-busted with the app version
        run: ./tools/check-cache-bust.sh
      - name: Check the site's version fallback matches the app version
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' app/manifest.json | head -1)
          grep -q "id=\"hero-version\">v$v " docs/index.html || {
            echo "docs/index.html: hero-version should start with v$v (shown when the GitHub API is unavailable)"
            exit 1
          }

  sparkplug_codec:
    name: Sparkplug B codec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the protobuf round-trip tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iapp/engine \
             -o /tmp/sparkplug_pb_test \
             tools/sparkplug_pb_test.c app/engine/sparkplug_pb.c
          /tmp/sparkplug_pb_test

  modbus_codec:
    name: Modbus codec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the data type, word order and validation tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iapp/engine \
             -o /tmp/modbus_codec_test \
             tools/modbus_codec_test.c app/engine/modbus_codec.c app/cJSON.c -lm
          /tmp/modbus_codec_test

  gps_nmea:
    name: GPS NMEA parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the tolerant NMEA parser tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iapp/engine \
             -o /tmp/gps_nmea_test tools/gps_nmea_test.c app/engine/gps_nmea.c -lm
          /tmp/gps_nmea_test

  gps_reader:
    name: GPS input reader tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install GLib headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libglib2.0-dev
      - name: Build and run the UDP reader integration test
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined \
             $(pkg-config --cflags glib-2.0) -o /tmp/gps_reader_test \
             tools/gps_reader_test.c app/engine/gps.c app/engine/gps_nmea.c app/cJSON.c \
             $(pkg-config --libs glib-2.0) -lpthread -lm
          /tmp/gps_reader_test

  certs:
    name: TLS profile store tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the certificate store and mutual-TLS handshake tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
          cc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iapp/engine \
             -o /tmp/certs_test tools/certs_test.c app/engine/certs.c app/cJSON.c -lssl -lcrypto -lpthread
          /tmp/certs_test

  rule_secrets:
    name: Rule secret masking tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the export masking and import restore tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iapp/engine \
             -o /tmp/rule_secrets_test tools/rule_secrets_test.c app/engine/rule_secrets.c app/cJSON.c -lm
          /tmp/rule_secrets_test

  build_acap:
    name: Build ACAP (${{ matrix.arch }})
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hf]
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: RUNTIME=docker ./build.sh ${{ matrix.arch }}
      - name: Verify
        run: |
          for f in *.eap; do
            echo "Verification of $f:"
            tar tzf "$f"
          done
      - name: Check glibc symbol versions
        # Newer SDK symbol versions (e.g. GLIBC_2.42 cfsetospeed) stop the app
        # loading on older AXIS OS; 2.34 is what released builds require.
        run: |
          tar xzf *.eap acap_event_engine
          max=$(readelf -W --dyn-syms acap_event_engine | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "Highest required: $max"
          [ "$(printf '%s\nGLIBC_2.34\n' "$max" | sort -V | tail -1)" = GLIBC_2.34 ]
