---
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs_sync:
    name: Docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check docs/help.html matches the in-app manual
        run: ./tools/sync-docs.sh --check
      - name: Check UI assets are cache-busted with the app version
        run: ./tools/check-cache-bust.sh

  sparkplug_codec:
    name: Sparkplug B codec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the protobuf round-trip tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iapp/engine \
             -o /tmp/sparkplug_pb_test \
             tools/sparkplug_pb_test.c app/engine/sparkplug_pb.c
          /tmp/sparkplug_pb_test

  certs:
    name: TLS profile store tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the certificate store and mutual-TLS handshake tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
          cc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iapp/engine \
             -o /tmp/certs_test tools/certs_test.c app/engine/certs.c app/cJSON.c -lssl -lcrypto -lpthread
          /tmp/certs_test

  build_acap:
    name: Build ACAP (${{ matrix.arch }})
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hf]
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: RUNTIME=docker ./build.sh ${{ matrix.arch }}
      - name: Verify
        run: |
          for f in *.eap; do
            echo "Verification of $f:"
            tar tzf "$f"
          done
